name: flutter_nutrimama
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  loading_animation_widget: ^1.3.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/nutri_Logo.png"


flutter:
  uses-material-design: true
  fonts:
      - family: Montserrat
        fonts:
          - asset: fonts/Montserrat-Bold.ttf
            weight: 700
          - asset: fonts/Montserrat-Medium.ttf
            weight: 500

  assets: 
      - assets/images/nutriMAMA.png
      - assets/images/nutri_Logo.png
      - assets/images/exit.png
  

